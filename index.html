<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lindenau</title>
<meta name="description" content="Isometrische Stadtbausimulation: vom Dorf am Fluss zur Metropole.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<!--APP-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M5 3l13 7-5.5 1.6L10 17z" fill="currentColor" stroke="none"/><path d="M12.5 11.6l4.5 6.4"/></symbol>
    <symbol id="i-road" viewBox="0 0 24 24"><path d="M7 21L10 3M17 21L14 3"/><path d="M12 6v2.5M12 11v2.5M12 16v2.5"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11L12 4l8.5 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M4 9l1.5-5h13L20 9"/><path d="M4 9c0 1.7 1.3 2.5 2.7 2.5S9.3 10.7 9.3 9c0 1.7 1.3 2.5 2.7 2.5s2.7-.8 2.7-2.5c0 1.7 1.3 2.5 2.6 2.5S20 10.7 20 9"/><path d="M5.5 12v8h13v-8"/><path d="M10 20v-4.5h4V20"/></symbol>
    <symbol id="i-factory" viewBox="0 0 24 24"><path d="M3 20V11l5 3v-3l5 3v-3l5 3V4h3v16z"/><path d="M7 17h2M12 17h2"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 21v-6"/><path d="M12 3c-3.5 0-6 2.7-6 5.6 0 3.3 2.6 6 6 6s6-2.7 6-6C18 5.7 15.5 3 12 3z"/></symbol>
    <symbol id="i-civic" viewBox="0 0 24 24"><path d="M3 9l9-5 9 5"/><path d="M4 20h16M5 9.5h14"/><path d="M7 10v8M12 10v8M17 10v8"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="2.5"/><path d="M5 11h14M8 17.5V20M16 17.5V20"/><circle cx="8.5" cy="14.3" r=".9" fill="currentColor"/><circle cx="15.5" cy="14.3" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-bulldoze" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.8 3-5.8 6-5.8s5.4 2 6 5.8"/><path d="M15.5 4.9a3.2 3.2 0 010 6.2M17.5 14.6c2 .7 3.2 2.5 3.5 5.4"/></symbol>
    <symbol id="i-work" viewBox="0 0 24 24"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M9 7.5V5.5h6v2M3.5 12.5h17"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7"/><path d="M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/></symbol>
    <symbol id="i-smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 14c.9 1.4 2.1 2 3.5 2s2.6-.6 3.5-2"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="2.6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" stroke-width="2.6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 019.5 4.5a8 8 0 1010 10z"/></symbol>
    <symbol id="i-dusk" viewBox="0 0 24 24"><path d="M3 18h18M6 14a6 6 0 0112 0"/><path d="M12 4v3M4.5 8.5l2 2M19.5 8.5l-2 2"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><path d="M12 3.5a8.5 8.5 0 108.5 8.5"/><path d="M12 7v5l3 2"/><path d="M17 3.5h3.5V7"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3.5" y="5" width="12" height="14" rx="2"/><path d="M15.5 10l5-3v10l-5-3"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-rotl" viewBox="0 0 24 24"><path d="M4.5 9A8 8 0 1112 20"/><path d="M4 4v5h5"/></symbol>
    <symbol id="i-rotr" viewBox="0 0 24 24"><path d="M19.5 9A8 8 0 1012 20"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-crane" viewBox="0 0 24 24"><path d="M6 21V4h2v17M3 21h8M8 5h13M8 5l4 4M19 5v6"/><rect x="17" y="11" width="4" height="3"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.9 3.3-5.8 3.8-9.8 2.4 1.5 3.7 3.4 3.9 5.6.9-.8 1.5-2 1.6-3.4 2 1.7 3.7 4.3 3.7 7.6 0 3.6-2.6 6.2-6.5 6.2z"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.5 4.5 0 010 6M18 6.5a8 8 0 010 11"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></symbol>
  </defs>
</svg>

<div id="app">
  <canvas id="scene" aria-label="Stadtansicht"></canvas>

  <div id="loading" class="loading">
    <div class="load-card">
      <div class="load-title">Lindenau</div>
      <div class="load-sub">Die Dächer werden gedeckt …</div>
      <div class="load-bar"><div></div></div>
    </div>
  </div>

  <header class="hud-top">
    <div class="card city">
      <div class="city-row">
        <input id="cityName" value="Lindenau" maxlength="24" aria-label="Name der Stadt" spellcheck="false">
        <span id="stageChip" class="chip">Dorf</span>
      </div>
      <div class="stage-bar" aria-hidden="true"><div id="stageFill"></div></div>
      <div id="stageNext" class="sub">&nbsp;</div>
    </div>
    <div class="card stats" role="status">
      <div class="stat" title="Einwohner"><svg class="ic"><use href="#i-people"/></svg><b id="sPop">0</b></div>
      <div class="stat" title="Arbeitsplätze"><svg class="ic"><use href="#i-work"/></svg><b id="sJobs">0</b></div>
      <div class="stat money" title="Stadtkasse"><svg class="ic"><use href="#i-coin"/></svg><b id="sMoney">0 €</b><small id="sRate">+0 €/Tag</small></div>
      <div class="stat" title="Zufriedenheit"><svg class="ic"><use href="#i-smile"/></svg><b id="sHappy">0 %</b></div>
      <div class="stat time" title="Datum und Uhrzeit"><svg class="ic"><use href="#i-clock"/></svg><b id="sTime">Tag 1 · 09:00</b></div>
    </div>
    <div class="card controls">
      <div class="seg" role="group" aria-label="Geschwindigkeit">
        <button data-speed="0" title="Pause (Leertaste)"><svg class="ic"><use href="#i-pause"/></svg></button>
        <button data-speed="1" class="on" title="Normal">1×</button>
        <button data-speed="2" title="Schnell">2×</button>
        <button data-speed="4" title="Sehr schnell">4×</button>
      </div>
      <button id="btnSound" class="iconbtn" title="Geräusche einschalten"><svg class="ic"><use href="#i-mute"/></svg></button>
      <button id="btnDay" class="iconbtn" title="Tageszeit: Automatisch"><svg class="ic"><use href="#i-auto"/></svg></button>
      <button id="btnCinema" class="iconbtn" title="Kinomodus: Kamera fährt langsam um die Stadt (K)"><svg class="ic"><use href="#i-film"/></svg></button>
      <button id="btnMenu" class="iconbtn" title="Menü"><svg class="ic"><use href="#i-menu"/></svg></button>
    </div>
  </header>

  <aside class="side-right">
    <div class="card demand" title="Nachfrage nach Wohnungen, Gewerbe und Industrie">
      <div class="dem"><div class="dem-bar"><i id="dR"></i></div><span>W</span></div>
      <div class="dem"><div class="dem-bar"><i id="dC"></i></div><span>G</span></div>
      <div class="dem"><div class="dem-bar"><i id="dI"></i></div><span>I</span></div>
    </div>
    <div class="card camctl">
      <button id="zIn" class="iconbtn" title="Heranzoomen (+)"><svg class="ic"><use href="#i-plus"/></svg></button>
      <button id="zOut" class="iconbtn" title="Herauszoomen (−)"><svg class="ic"><use href="#i-minus"/></svg></button>
      <button id="rotL" class="iconbtn" title="Nach links drehen (Q)"><svg class="ic"><use href="#i-rotl"/></svg></button>
      <button id="rotR" class="iconbtn" title="Nach rechts drehen (E)"><svg class="ic"><use href="#i-rotr"/></svg></button>
    </div>
  </aside>

  <div id="toasts" aria-live="polite"></div>
  <div class="card mini"><canvas id="minimap" width="168" height="168" aria-label="Übersichtskarte"></canvas></div>

  <div id="followPill" class="pill" hidden><svg class="ic"><use href="#i-eye"/></svg><span id="followText"></span><button id="followStop">Beenden</button></div>
  <div id="hint" class="hint" hidden></div>
  <div id="flyout" class="card flyout" hidden></div>
  <nav id="toolbar" class="card toolbar" aria-label="Werkzeuge"></nav>

  <section id="info" class="card info" hidden aria-live="polite"></section>

  <div id="banner" class="banner" hidden>
    <div class="banner-kicker">Neue Stufe erreicht</div>
    <div id="bannerTitle" class="banner-title">Kleinstadt</div>
    <div id="bannerText" class="banner-text"></div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="card modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </div>
  </div>
</div>
<!--/APP-->
<script type="module" src="js/main.js"></script>
</body>
</html>
